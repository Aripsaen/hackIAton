<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Licitando</title>
  <link rel="stylesheet" href="/static/style.css"/>
</head>
<body class="theme-licitando">
  <div class="container">
    <h1>Licitando</h1>

    <section class="upload-section card">
      <h2>Subir Documentos de Oferentes</h2>
      <input type="file" id="pdfUpload" accept=".pdf" multiple />
      <button id="startAnalysisBtn">Iniciar Análisis</button>
      <div id="uploadStatus" class="status-message"></div>
      <div id="caseIdDisplay" class="info-message"></div>
    </section>

    <section class="case-list-section card">
      <h2>Casos Existentes</h2>
      <ul id="caseList"></ul>
    </section>

    <!-- Optional purely-decorative elements (safe to remove if not wanted) -->
    <div class="violet-divider" aria-hidden="true"></div>
    <!-- div class="city-skyline-strip" aria-hidden="true"></div-->

    <section id="analysisResultsSection" class="analysis-results-section card" style="display:none;">
      <h2>Resultados del Análisis para el Caso: <span id="currentCaseId"></span></h2>
      <div id="resultsStatus" class="status-message"></div>
      <div id="bidderComparison"></div>
      <button id="downloadReportBtn" style="display:none;">Descargar Informe (PDF)</button>
    </section>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
