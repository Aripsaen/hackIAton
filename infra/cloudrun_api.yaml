# This file is for documentation or use with `gcloud run services replace`.
# The recommended deployment method is the `gcloud run deploy` command in the README.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: api-procurement
spec:
  template:
    spec:
      containers:
      - image: gcr.io/your-gcp-project-id/api-procurement:latest
        ports:
        - containerPort: 8080
        env:
        - name: PROJECT_ID
          value: "your-gcp-project-id"
        - name: BUCKET_NAME
          value: "your-gcs-bucket-name"
        - name: GOOGLE_SHEET_ID
          value: "your-google-sheet-id"
