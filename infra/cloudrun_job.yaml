# This file is for documentation or use with `gcloud run jobs replace`.
# The recommended deployment method is the `gcloud run jobs deploy` command in the README.
apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: worker-procurement
spec:
  template:
    spec:
      template:
        spec:
          containers:
          - image: gcr.io/your-gcp-project-id/worker-procurement:latest
            args:
            - "--case_id=default-case" # This will be overridden at execution time
            env:
            - name: PROJECT_ID
              value: "your-gcp-project-id"
            - name: BUCKET_NAME
              value: "your-gcs-bucket-name"
            - name: GOOGLE_SHEET_ID
              value: "your-google-sheet-id"
          restartPolicy: OnFailure
